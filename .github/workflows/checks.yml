# Checks that need no model calls and no raw logs: the preregistered protocol is unchanged since the
# freeze, the test suite passes, and every number in the paper still follows from sting_results/.
# Environment: llm-agent-collusion-2/uv.lock (the study's locked dependencies) plus the study
# requirements. Actions are pinned to commit SHAs and the token is read-only (GitHub's guidance).
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.32"
      - name: Install the locked environment
        working-directory: llm-agent-collusion-2
        run: |
          uv sync --locked --python 3.12
          uv pip install -r Collusion_Liars_Bar/sting/requirements.txt
      - name: Protocol unchanged since the freeze
        working-directory: llm-agent-collusion-2/Collusion_Liars_Bar
        run: ../.venv/bin/python -m sting freeze --check
      - name: Tests
        working-directory: llm-agent-collusion-2/sting_tests
        run: ../.venv/bin/python -m pytest -q
      - name: Paper numbers match the committed results
        run: llm-agent-collusion-2/.venv/bin/python paper/check_numbers.py
